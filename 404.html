<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — SeedStone</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest: #1B3A2D;
      --earth:  #C47C3E;
      --white:  #FFFFFF;
      --muted:  rgba(255,255,255,0.55);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--forest);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Dot pattern */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: radial-gradient(circle, #fff 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* Gold glow */
    body::after {
      content: '';
      position: absolute;
      right: -100px;
      top: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(196,124,62,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
    }

    /* Logo */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 48px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--earth);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { color: white; }
    .logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.02em;
    }
    .logo-text span { color: var(--earth); }

    /* 404 number */
    .big-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      margin-bottom: 8px;
      opacity: 0.12;
      user-select: none;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 20px;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: var(--white);
      font-weight: 700;
      margin-bottom: 14px;
      line-height: 1.2;
    }
    h1 em { color: var(--earth); font-style: normal; }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 36px;
      font-weight: 300;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
    }

    .btn-primary {
      background: var(--earth);
      color: var(--white);
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background .2s, transform .15s;
    }
    .btn-primary:hover { background: #d4883f; transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      color: var(--white);
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.95rem;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .2s;
    }
    .btn-outline:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.05); }

    /* Quick links */
    .quick-links {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .quick-links a {
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color .2s;
    }
    .quick-links a:hover { color: var(--earth); }

    /* Divider */
    .divider {
      width: 40px;
      height: 2px;
      background: rgba(196,124,62,0.4);
      margin: 0 auto 32px;
      border-radius: 2px;
    }

    @media (max-width: 480px) {
      .actions { flex-direction: column; align-items: center; }
      .btn-primary, .btn-outline { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">

    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      <div class="logo-text">Seed<span>Stone</span></div>
    </a>

    <div class="big-number">404</div>

    <span class="icon">🏚️</span>

    <h1>This page has <em>moved out</em></h1>

    <div class="divider"></div>

    <p>The page you're looking for doesn't exist or may have been moved.<br/>Let's get you back to finding your perfect home.</p>

    <div class="actions">
      <a href="index.html" class="btn-primary">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Back to Home
      </a>
      <a href="cars.html" class="btn-outline">
        🚗 Browse Cars
      </a>
    </div>

    <div class="quick-links">
      <a href="index.html#listings">Properties</a>
      <a href="cars.html">Cars</a>
      <a href="seeker.html">Seeker Portal</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="https://wa.me/237675685453" target="_blank">💬 WhatsApp Us</a>
    </div>

  </div>
</body>
</html>
